{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  {{ with .Data.Terms.Alphabetical }}
  <ul class="tag-list" aria-label="Taxonomy terms">
    {{ range . }}
    <li>
      <a href="{{ .Page.RelPermalink }}">
        {{ .Page.LinkTitle }} <small>({{ .Count }})</small>
      </a>
    </li>
    {{ end }}
  </ul>
  {{ else }}
  <p>No terms yet.</p>
  {{ end }}
</article>
{{ end }}
